[project]
name = "hospital-ai-platform"
version = "1.0.0"
description = "Agentic AI Mastery — Hospital Intelligence Platform Tutorial Series"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
    # LangChain ecosystem
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-qdrant>=0.1.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    # LLM providers
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    # Vector DB
    "qdrant-client>=1.9.0",
    # Embeddings
    "tiktoken>=0.7.0",
    # Document loading
    "pypdf>=4.3.0",
    "python-multipart>=0.0.9",
    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",
    "ragas>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",
    "ragas>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["shared"]
