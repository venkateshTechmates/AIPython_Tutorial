services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: hospital_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlite-web:
    image: coleifer/sqlite-web:latest
    container_name: hospital_sqlite_web
    ports:
      - "8081:8080"
    volumes:
      - ./hospital.db:/data/hospital.db
    command: ["-H", "0.0.0.0", "-p", "8080", "-r", "/data/hospital.db"]
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
